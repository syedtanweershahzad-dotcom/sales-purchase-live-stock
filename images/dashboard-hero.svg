<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#dashGrad)"/>
  
  <!-- Chart Background -->
  <rect x="50" y="50" width="700" height="220" rx="15" fill="rgba(15, 23, 42, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  
  <!-- Bar Chart Visualization -->
  <g opacity="0.8">
    <!-- Bars -->
    <rect x="100" y="200" width="40" height="50" fill="#10b981"/>
    <rect x="160" y="160" width="40" height="90" fill="#34d399"/>
    <rect x="220" y="140" width="40" height="110" fill="#10b981"/>
    <rect x="280" y="120" width="40" height="130" fill="#34d399"/>
    <rect x="340" y="100" width="40" height="150" fill="#10b981"/>
    <rect x="400" y="180" width="40" height="70" fill="#34d399"/>
    <rect x="460" y="130" width="40" height="120" fill="#10b981"/>
    <rect x="520" y="90" width="40" height="160" fill="#34d399"/>
    <rect x="580" y="110" width="40" height="140" fill="#10b981"/>
    <rect x="640" y="150" width="40" height="100" fill="#34d399"/>
  </g>
  
  <!-- Grid Lines -->
  <line x1="50" y1="250" x2="750" y2="250" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <line x1="50" y1="100" x2="750" y2="100" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">DASHBOARD ANALYTICS</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Real-time Sales & Inventory Performance</text>
</svg>
