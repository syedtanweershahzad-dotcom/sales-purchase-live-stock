<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="salesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#salesGrad)"/>
  
  <!-- Shopping Cart Icon Area -->
  <rect x="50" y="50" width="700" height="220" rx="15" fill="rgba(15, 23, 42, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  
  <!-- Shopping Bags -->
  <g opacity="0.8">
    <!-- Bag 1 -->
    <path d="M 120 150 L 140 100 L 160 150 Z" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <rect x="115" y="150" width="50" height="60" rx="5" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <circle cx="140" cy="155" r="5" fill="#34d399"/>
    
    <!-- Bag 2 -->
    <path d="M 280 170 L 300 110 L 320 170 Z" fill="#34d399" stroke="#10b981" stroke-width="2"/>
    <rect x="275" y="170" width="50" height="60" rx="5" fill="#34d399" stroke="#10b981" stroke-width="2"/>
    <circle cx="300" cy="175" r="5" fill="#10b981"/>
    
    <!-- Bag 3 -->
    <path d="M 440 140 L 460 90 L 480 140 Z" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <rect x="435" y="140" width="50" height="60" rx="5" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <circle cx="460" cy="145" r="5" fill="#34d399"/>
    
    <!-- Bag 4 -->
    <path d="M 600 160 L 620 110 L 640 160 Z" fill="#34d399" stroke="#10b981" stroke-width="2"/>
    <rect x="595" y="160" width="50" height="60" rx="5" fill="#34d399" stroke="#10b981" stroke-width="2"/>
    <circle cx="620" cy="165" r="5" fill="#10b981"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">SALES MANAGEMENT</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Track Customer Orders & Transactions</text>
</svg>
