<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="purchaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#purchaseGrad)"/>
  
  <!-- Box Stacks -->
  <rect x="50" y="50" width="700" height="220" rx="15" fill="rgba(15, 23, 42, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  
  <!-- Stacked Boxes -->
  <g opacity="0.8">
    <!-- Stack 1 -->
    <rect x="100" y="180" width="50" height="50" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <rect x="100" y="140" width="50" height="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <rect x="100" y="100" width="50" height="50" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    
    <!-- Stack 2 -->
    <rect x="250" y="160" width="50" height="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <rect x="250" y="120" width="50" height="50" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <rect x="250" y="80" width="50" height="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Stack 3 -->
    <rect x="400" y="150" width="50" height="50" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <rect x="400" y="110" width="50" height="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Stack 4 -->
    <rect x="550" y="170" width="50" height="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <rect x="550" y="130" width="50" height="50" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <rect x="550" y="90" width="50" height="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">PURCHASE ORDERS</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Manage Supplier Inventory & Stock Incoming</text>
</svg>
