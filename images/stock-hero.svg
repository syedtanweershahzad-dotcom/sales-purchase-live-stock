<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="stockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#stockGrad)"/>
  
  <!-- Warehouse Shelves -->
  <rect x="50" y="50" width="700" height="220" rx="15" fill="rgba(15, 23, 42, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  
  <!-- Shelving Unit -->
  <g opacity="0.8">
    <!-- Vertical Posts -->
    <rect x="100" y="80" width="8" height="180" fill="#818cf8"/>
    <rect x="300" y="80" width="8" height="180" fill="#818cf8"/>
    <rect x="500" y="80" width="8" height="180" fill="#818cf8"/>
    <rect x="700" y="80" width="8" height="180" fill="#818cf8"/>
    
    <!-- Shelves -->
    <rect x="100" y="100" width="610" height="6" fill="#6366f1" opacity="0.6"/>
    <rect x="100" y="150" width="610" height="6" fill="#818cf8" opacity="0.6"/>
    <rect x="100" y="200" width="610" height="6" fill="#6366f1" opacity="0.6"/>
    
    <!-- Items on Shelves -->
    <circle cx="150" cy="90" r="8" fill="#a5f3fc"/>
    <circle cx="200" cy="90" r="8" fill="#a5f3fc"/>
    <circle cx="350" cy="140" r="8" fill="#bfdbfe"/>
    <circle cx="400" cy="140" r="8" fill="#bfdbfe"/>
    <circle cx="450" cy="140" r="8" fill="#bfdbfe"/>
    <circle cx="500" cy="190" r="8" fill="#a5f3fc"/>
    <circle cx="600" cy="190" r="8" fill="#bfdbfe"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">LIVE INVENTORY</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Complete Warehouse Stock Management</text>
</svg>
