<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0f172a"/>
  
  <!-- Laptop Screen -->
  <rect x="50" y="40" width="300" height="200" rx="15" fill="#1e293b" stroke="url(#laptopGrad)" stroke-width="3"/>
  
  <!-- Screen Shine -->
  <rect x="55" y="45" width="290" height="190" rx="12" fill="url(#laptopGrad)" opacity="0.1"/>
  
  <!-- Laptop Base -->
  <rect x="80" y="235" width="240" height="8" rx="4" fill="url(#laptopGrad)"/>
  <polygon points="100,243 300,243 310,260 90,260" fill="#1e293b" stroke="url(#laptopGrad)" stroke-width="2"/>
  
  <!-- Screen Content - Circuit Pattern -->
  <circle cx="100" cy="80" r="8" fill="#06b6d4" opacity="0.6"/>
  <circle cx="300" cy="150" r="6" fill="#0ea5e9" opacity="0.6"/>
  <circle cx="150" cy="200" r="7" fill="#06b6d4" opacity="0.6"/>
  
  <!-- Lines -->
  <line x1="100" y1="80" x2="150" y2="120" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <line x1="150" y1="120" x2="300" y2="150" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>
  <line x1="300" y1="150" x2="150" y2="200" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  
  <!-- Text -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#06b6d4" text-anchor="middle" opacity="0.7">LAPTOP</text>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle" opacity="0.5">Professional Series</text>
</svg>
