<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & Stock - LapTech System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <div class="w-64 bg-gradient-to-b from-slate-900 to-slate-950 text-white flex flex-col justify-between hidden md:flex shadow-2xl">
            <div class="p-6">
                <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 mb-8"><i class="fa-solid fa-laptop"></i> LapTech</h1>
                <nav class="space-y-3">
                    <a href="dashboard.html" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800 hover:text-cyan-400 font-medium transition">
                        <i class="fa-solid fa-chart-pie w-5"></i> <span>Dashboard</span>
                    </a>
                    <a href="sales.html" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800 hover:text-cyan-400 font-medium transition">
                        <i class="fa-solid fa-cart-shopping w-5"></i> <span>Laptop Sales</span>
                    </a>
                    <a href="purchase.html" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800 hover:text-cyan-400 font-medium transition">
                        <i class="fa-solid fa-bag-shopping w-5"></i> <span>Laptop Purchase</span>
                    </a>
                    <a href="stock.html" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-cyan-600 to-cyan-500 text-white font-medium transition hover:shadow-lg">
                        <i class="fa-solid fa-boxes-stacked w-5"></i> <span>Inventory / Stock</span>
                    </a>
                </nav>
            </div>
            <div class="p-6 border-t border-slate-800 text-xs text-gray-500 text-center">
                &copy; 2026 LapTech Management
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto bg-gradient-to-br from-gray-50 to-gray-100">
            <header class="bg-white shadow-lg px-6 py-5 flex justify-between items-center border-b-2 border-cyan-200">
                <h2 class="text-2xl font-bold bg-gradient-to-r from-cyan-600 to-blue-600 bg-clip-text text-transparent">Inventory & Live Stock</h2>
                <div class="flex items-center space-x-4">
                    <span class="text-sm bg-gradient-to-r from-cyan-100 to-blue-100 text-cyan-800 font-bold px-4 py-1.5 rounded-full shadow-sm">Admin Panel</span>
                </div>
            </header>

            <main class="p-8 max-w-7xl w-full mx-auto">
                <!-- Hero Section with Stock Image -->
                <div class="hero-section relative mb-8 overflow-hidden rounded-3xl">
                    <img src="images/stock-hero.svg" alt="Inventory Management" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-r from-indigo-900/30 to-purple-900/30"></div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="text-center text-white z-10">
                            <h2 class="text-5xl font-bold mb-2">Inventory & Live Stock</h2>
                            <p class="text-2xl opacity-90">Complete stock management and tracking system</p>
                        </div>
                    </div>
                </div>

                <!-- Stock Illustration Card -->
                <div class="card-hover bg-gradient-to-br from-indigo-50 to-purple-50 p-8 rounded-2xl shadow-lg border border-indigo-200 mb-6">
                    <div class="image-card">
                        <div class="text-center">
                            <i class="fa-solid fa-warehouse block mb-4 opacity-40"></i>
                            <p class="text-gray-400 text-lg font-semibold">Warehouse Stock</p>
                        </div>
                    </div>
                </div>

                <div class="card-hover bg-white p-8 rounded-2xl shadow-lg border border-gray-100 overflow-x-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-gray-800">Current Stock Inventory</h3>
                        <span class="text-xs bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full">Auto-calculated</span>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-indigo-200 text-gray-600 text-sm font-bold">
                                <th class="pb-4 uppercase tracking-wider">Laptop Model</th>
                                <th class="pb-4 uppercase tracking-wider">Available Quantity</th>
                                <th class="pb-4 uppercase tracking-wider">Status</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody" class="text-gray-600 text-sm divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
